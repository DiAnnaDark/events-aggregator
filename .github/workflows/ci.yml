name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: events_aggregator_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: events_test_only
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d events_aggregator_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.9"

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        env:
          EVENTS_AGGREGATOR_TEST_DATABASE_URL: postgresql+asyncpg://postgres:events_test_only@127.0.0.1:55433/events_aggregator_test
        run: uv run python -m pytest -q

  build:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Send deploy request to LMS
        env:
          LMS_API_KEY: ${{ secrets.LMS_API_KEY }}
          IMAGE: ${{ needs.build.outputs.image }}
          REPOSITORY: ${{ github.repository }}

        run: |
          if [ -z "$LMS_API_KEY" ]; then
            echo "LMS_API_KEY secret is not configured"
            exit 1
          fi

          HTTP_CODE=$(curl --silent --show-error \
            --output response.txt \
            --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-API-Key: $LMS_API_KEY" \
            --data "{\"image\":\"$IMAGE\",\"repository\":\"$REPOSITORY\"}" \
            "https://lms.python-labs.ru/api/deploy-requests")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "LMS deploy request failed: HTTP $HTTP_CODE"
            cat response.txt
            exit 1
          fi

          echo "LMS deployment request accepted"