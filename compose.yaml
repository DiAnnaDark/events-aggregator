services:
  db:
    image: postgres:16

    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE_NAME:?Database name required}
      POSTGRES_USER: ${POSTGRES_USERNAME:?Database user required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: